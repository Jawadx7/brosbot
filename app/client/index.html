<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrosBot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Join screen -->
  <div id="join-screen" class="screen">
    <div class="join-card">
      <h1>BrosBot</h1>
      <p class="subtitle">Enter a name to join the chat.</p>
      <input id="name-input" type="text" placeholder="Your name" maxlength="30" autocomplete="off" />
      <button id="join-btn">Join chat</button>
      <p id="join-error" class="error-text"></p>
    </div>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <span class="chat-title">BrosBot</span>
      <span id="connection-status" class="status-dot status-connected"></span>
    </header>

    <div id="messages" class="messages"></div>

    <form id="message-form" class="message-form">
      <input id="message-input" type="text" placeholder="Message" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Socket.io client is auto-served by the socket.io server at this path -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
